name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WAREHOUSE_PATH: data/ci.duckdb
      CI_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      - name: Load fixture data
        run: python src/ingest.py --file tests/fixtures/sample.csv

      - name: dbt build (models + tests)
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Data quality tests
        run: python -m pytest -q

      - name: Render report
        run: python src/report.py
