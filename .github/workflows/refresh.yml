name: Refresh data

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest latest Price Paid data
        run: python src/ingest.py

      - name: dbt build
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Data quality tests
        run: python -m pytest -q

      - name: Export summary and chart
        run: python src/report.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.csv docs/chart.png
          git diff --cached --quiet || git commit -m "chore: weekly data refresh"
          git push
